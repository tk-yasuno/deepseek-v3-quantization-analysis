# Q4_K_M量子化設定（Takato専用）
# 16GB外付けGPU環境での最適化パラメータ

## モデル指定
KIMI_K2_MODEL_FILE="Kimi-K2-Instruct.Q4_K_M.gguf"
DEEPSEEK_V3_MODEL="deepseek-coder:6.7b-instruct-q4_0"

## GPU設定（Q4_K_M最適化）
GPU_LAYERS=35              # GPUで処理する層数
CONTEXT_SIZE=4096          # コンテキストウィンドウ
BATCH_SIZE=512             # バッチサイズ（メモリ効率）
UBATCH_SIZE=256            # マイクロバッチサイズ

## 推論パラメータ
TEMPERATURE=0.7            # 創造性レベル
TOP_P=0.9                  # 語彙選択範囲
REPEAT_PENALTY=1.1         # 繰り返し抑制

## メモリ使用量目安（Q4_K_M）
# Kimi K2: 約6-8GB VRAM
# DeepSeek V3: 約8-10GB VRAM
# 合計: 最大18GB（余裕を持って16GB GPU推奨）

## 期待される性能
# Kimi K2 Q4_K_M: 40-60 tokens/sec
# DeepSeek V3 Q4_0: 30-50 tokens/sec
# 品質: 実用レベル（業務使用可能）